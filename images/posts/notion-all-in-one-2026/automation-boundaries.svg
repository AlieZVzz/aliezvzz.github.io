<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">程序、AI Agent 与人的职责边界</title>
  <desc id="desc">程序处理确定性同步，AI Agent 负责语义判断，人负责目标、意义和最终决定，三者围绕 Notion 中的共享状态协作。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#5279A9"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#42816C"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1L11 6L1 11Z" fill="#B96845"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FAF8F3"/>

  <text x="100" y="100" fill="#263548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="39" font-weight="720">同一套状态，不同的职责</text>
  <text x="100" y="142" fill="#758092" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20">机器减少维护成本，人保留目标、意义与最终决定</text>
  <path d="M100 174H1500" stroke="#E4DFD5" stroke-width="2"/>

  <path d="M510 438H648" stroke="#5279A9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M1090 438H952" stroke="#42816C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <path d="M800 652V574" stroke="#B96845" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-coral)"/>

  <g>
    <circle cx="360" cy="438" r="128" fill="#EDF3FA" stroke="#5279A9" stroke-width="3"/>
    <rect x="310" y="358" width="100" height="76" rx="20" fill="#FFFFFF" stroke="#5279A9" stroke-width="4"/>
    <circle cx="340" cy="396" r="12" fill="none" stroke="#5279A9" stroke-width="4"/>
    <circle cx="380" cy="396" r="12" fill="none" stroke="#5279A9" stroke-width="4"/>
