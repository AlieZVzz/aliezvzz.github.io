    <text x="1240" y="510" text-anchor="middle" fill="#527467" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17">语义判断</text>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="360" y="622" text-anchor="middle" fill="#718095" font-size="16">RSS · 去重 · 固定字段</text>
    <text x="1240" y="622" text-anchor="middle" fill="#718095" font-size="16">归纳 · 关联 · 复盘</text>
  </g>

  <g>
    <circle cx="800" cy="738" r="72" fill="#FFF0E6" stroke="#B96845" stroke-width="3"/>
    <circle cx="800" cy="718" r="21" fill="#E2A386"/>
    <path d="M761 766C770 735 830 735 839 766" fill="#E2A386"/>
    <circle cx="800" cy="738" r="88" fill="none" stroke="#EBC4B1" stroke-width="2" stroke-dasharray="5 9"/>
  </g>
  <text x="910" y="718" fill="#97502F" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="720">我</text>
  <text x="910" y="752" fill="#6D6870" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18">目标 · 情绪 · 意义 · 最终决定</text>
  <text x="910" y="782" fill="#9A8D86" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15">系统可以提供反馈，但不能替我定义价值</text>

  <text x="100" y="820" fill="#9AA3AF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="15">边界先于自动化</text>
</svg>
