    <text x="360" y="510" text-anchor="middle" fill="#5A718D" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="17">确定性同步</text>
  </g>

  <g>
    <circle cx="800" cy="438" r="146" fill="#304F78"/>
    <ellipse cx="800" cy="392" rx="76" ry="26" fill="#466A96"/>
    <path d="M724 392V471C724 486 758 498 800 498C842 498 876 486 876 471V392" fill="#3B5D88"/>
    <path d="M724 430C724 445 758 457 800 457C842 457 876 445 876 430" fill="none" stroke="#7894B5" stroke-width="3"/>
