    <text x="800" y="532" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="29" font-weight="720">共享状态</text>
    <text x="800" y="563" text-anchor="middle" fill="#D5E1EF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="16">Notion · 可信状态中枢</text>
  </g>

  <g>
    <circle cx="1240" cy="438" r="128" fill="#ECF6F1" stroke="#42816C" stroke-width="3"/>
    <circle cx="1240" cy="390" r="40" fill="#FFFFFF" stroke="#42816C" stroke-width="4"/>
