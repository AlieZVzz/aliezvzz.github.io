<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    {% include nav.html %}

    {% if page.toc==true %}
      <aside class="toc">
        {% include toc.html html=content %}
      </aside>
    {% endif %}

    <main id="main" class="wrapper-content{% if page.toc == true %} withtoc{% endif %}">
      <div class="container">
        {{ content }}
      </div>
    </main>

    {% include analytics.html %}

    <div class="wrapper-footer-mobile">
      <footer class="footer">
        {% include footer.html %}
      </footer>
    </div>
  </body>

</html>
